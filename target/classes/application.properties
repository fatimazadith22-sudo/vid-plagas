spring.application.name=vid-plagas
server.port=8080

spring.datasource.url=jdbc:h2:mem:vidplagasdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# spring.datasource.url=jdbc:mysql://localhost:3306/vidplagas
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola web de H2, util para ver la tabla "reportes" en desarrollo
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Subida de archivos (evidencia fotografica) ---
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=25MB

spring.jackson.serialization.write-dates-as-timestamps=false
server.port=8080
